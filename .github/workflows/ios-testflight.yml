name: iOS TestFlight CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          API_KEY_DATA: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          MISSING=""
          [ -z "$TEAM_ID" ] && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_ID"
          [ -z "$ISSUER_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$API_KEY_DATA" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$MISSING" ]; then
            echo "::error::Folgende GitHub Repository Secrets fehlen noch:$MISSING"
            exit 1
          fi
          echo "Alle benötigten Secrets sind vorhanden."

      - name: Select Latest Xcode Version
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Verwende Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Configure App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys ~/private_keys

          python3 - <<'PY'
          import os, base64, textwrap

          raw = os.environ.get("APP_STORE_CONNECT_API_KEY_BASE64", "").strip()
          key_id = os.environ["APP_STORE_CONNECT_API_KEY_ID"].strip()

          if "BEGIN PRIVATE KEY" not in raw:
              raw = base64.b64decode("".join(raw.split())).decode("utf-8")

          body = (
              raw.replace("-----BEGIN PRIVATE KEY-----", "")
                 .replace("-----END PRIVATE KEY-----", "")
          )
          body = "".join(body.split())
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"

          paths = [
              os.path.expanduser(f"~/.private_keys/AuthKey_{key_id}.p8"),
              os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")
          ]
          for p in paths:
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(pem)
              os.chmod(p, 0o600)
          PY

          openssl pkey -in "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" -noout
          openssl pkey -in "$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" -noout

      - name: Generate Xcode Project with XcodeGen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Build & Archive (Unsigned)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/Toepfle.xcodeproj \
            -scheme Toepfle \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Toepfle.xcarchive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export & Sign IPA per App Store Connect API
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p build/export

          cat <<EOF> ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          if ! xcodebuild -exportArchive \
            -archivePath build/Toepfle.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "${APP_STORE_CONNECT_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_STORE_CONNECT_ISSUER_ID}"; then

            echo "=== xcodebuild -exportArchive fehlgeschlagen ==="
            echo "=== Suche nach IDEDistribution.standard.log in /var/folders ==="
            find /var/folders -name "IDEDistribution.standard.log" -o -name "*.xcdistributionlogs" -o -name "IDEDistribution*.log" 2>/dev/null | while read -r logfile; do
              echo "--------------------------------------------------------"
              echo "Logdatei: $logfile"
              echo "--------------------------------------------------------"
              if [ -d "$logfile" ]; then
                cat "$logfile"/* 2>/dev/null || true
              else
                cat "$logfile" 2>/dev/null || true
              fi
            done
            exit 1
          fi

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID || secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Keine .ipa Datei im Exportverzeichnis gefunden!"
            exit 1
          fi

          echo "Lade $IPA_PATH zu TestFlight hoch..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: Print Distribution Logs on Failure
        if: failure()
        run: |
          echo "=== Suche nach Distribution Logs ==="
          find /var/folders -name "*.xcdistributionlogs" -o -name "IDEDistribution*.log" 2>/dev/null | while read -r logfile; do
            echo "--------------------------------------------------------"
            echo "Log: $logfile"
            echo "--------------------------------------------------------"
            if [ -d "$logfile" ]; then
              cat "$logfile"/* 2>/dev/null || true
            else
              cat "$logfile" 2>/dev/null || true
            fi
          done

      - name: Cleanup Private Keys
        if: always()
        run: |
          rm -rf ~/.private_keys ~/private_keys
