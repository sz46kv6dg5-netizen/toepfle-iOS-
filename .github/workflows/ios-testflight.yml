name: iOS TestFlight CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_DATA: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          MISSING=""
          [ -z "$TEAM_ID" ] && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_ID"
          [ -z "$ISSUER_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$API_KEY_DATA" ] && MISSING="$MISSING APP_STORE_CONNECT_API_KEY_BASE64"
          if [ -n "$MISSING" ]; then
            echo "::error::Folgende GitHub Repository Secrets fehlen noch:$MISSING"
            exit 1
          fi
          echo "Alle 4 benötigten Secrets sind vorhanden."

      - name: Select Latest Xcode Version
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Verwende Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Configure App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_DATA: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          if echo "$API_KEY_DATA" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$API_KEY_DATA" > ~/.private_keys/AuthKey_${KEY_ID}.p8
          else
            echo "$API_KEY_DATA" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8
          fi
          chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8

      - name: Configure ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/${TEAM_ID}/g" ios/ExportOptions.plist
          cat ios/ExportOptions.plist

      - name: Generate Xcode Project with XcodeGen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          xcodegen generate --spec project.yml

      - name: Build & Archive (Unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/Toepfle.xcodeproj \
            -scheme Toepfle \
            -destination "generic/platform=iOS" \
            -archivePath build/Toepfle.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export & Sign IPA per App Store Connect API
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/Toepfle.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "${KEY_ID}" \
            -authenticationKeyIssuerID "${ISSUER_ID}"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Keine .ipa Datei im Exportverzeichnis gefunden!"
            exit 1
          fi

          echo "Lade $IPA_PATH zu TestFlight hoch..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Print Distribution Logs on Failure
        if: failure()
        run: |
          echo "=== Suche nach Distribution Logs ==="
          find /var/folders -name "*.xcdistributionlogs" -o -name "IDEDistribution*.log" 2>/dev/null | while read -r logfile; do
            echo "--------------------------------------------------------"
            echo "Log: $logfile"
            echo "--------------------------------------------------------"
            if [ -d "$logfile" ]; then
              cat "$logfile"/* 2>/dev/null || true
            else
              cat "$logfile" 2>/dev/null || true
            fi
          done

      - name: Cleanup Private Keys
        if: always()
        run: |
          rm -rf ~/.private_keys
