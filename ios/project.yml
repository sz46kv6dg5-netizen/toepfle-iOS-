name: Toepfle
options:
  bundleIdPrefix: de.toepfle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic

targets:
  Toepfle:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Toepfle
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: "Töpfle"
        CFBundleDisplayName: "Töpfle"
        PRODUCT_BUNDLE_IDENTIFIER: de.toepfle.app
        INFOPLIST_FILE: Toepfle/Info.plist
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Toepfle/Toepfle.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ToepfleShareExtension
        embed: true

  ToepfleShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ToepfleShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: "ToepfleShareExtension"
        CFBundleDisplayName: "Töpfle"
        PRODUCT_BUNDLE_IDENTIFIER: de.toepfle.app.share
        INFOPLIST_FILE: ToepfleShareExtension/Info.plist
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ToepfleShareExtension/ToepfleShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
